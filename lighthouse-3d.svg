<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-labelledby="title desc">
  <title id="title">3D Lighthouse Petroleum lighthouse</title>
  <desc id="desc">A glossy navy lighthouse with silver trim, glowing lantern, oil-drop doorway and a softly blended golden beam.</desc>
  <defs>
    <linearGradient id="tower" x1="0" x2="1">
      <stop offset="0" stop-color="#052a4f"/>
      <stop offset="0.46" stop-color="#124d82"/>
      <stop offset="0.68" stop-color="#2e6fa6"/>
      <stop offset="1" stop-color="#06325e"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" x2="1">
      <stop offset="0" stop-color="#8c9aa7"/>
      <stop offset="0.45" stop-color="#f7fbff"/>
      <stop offset="0.7" stop-color="#b9c4ce"/>
      <stop offset="1" stop-color="#6f7c88"/>
    </linearGradient>
    <radialGradient id="lamp">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="0.35" stop-color="#fff1a8"/>
      <stop offset="0.7" stop-color="#ffbd24"/>
      <stop offset="1" stop-color="#f29b00"/>
    </radialGradient>
    <linearGradient id="roof" x1="0" x2="1">
      <stop offset="0" stop-color="#061d35"/>
      <stop offset="0.55" stop-color="#164f82"/>
      <stop offset="1" stop-color="#031a31"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#fff7c9" stop-opacity=".98"/>
      <stop offset=".22" stop-color="#ffd65a" stop-opacity=".84"/>
      <stop offset=".62" stop-color="#ffb518" stop-opacity=".42"/>
      <stop offset="1" stop-color="#ffb518" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" x2="1">
      <stop offset="0" stop-color="#031d38"/>
      <stop offset=".58" stop-color="#15568f"/>
      <stop offset="1" stop-color="#062b52"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <path d="M456 152 L900 82 L900 390 L456 278 Z" fill="url(#beam)"/>

  <g filter="url(#shadow)">
    <path d="M218 610 L243 300 L430 300 L459 610 Z" fill="url(#tower)"/>
    <path d="M185 610 H490 L525 655 H150 Z" fill="url(#tower)"/>
    <rect x="241" y="394" width="191" height="10" rx="5" fill="url(#metal)"/>
    <rect x="235" y="500" width="205" height="10" rx="5" fill="url(#metal)"/>

    <ellipse cx="336" cy="299" rx="135" ry="29" fill="#06284a"/>
    <rect x="215" y="221" width="242" height="86" rx="8" fill="#0a3157"/>
    <rect x="234" y="192" width="204" height="94" rx="10" fill="#173d5c" stroke="#c5d0da" stroke-width="5"/>
    <g stroke="#071e35" stroke-width="9">
      <line x1="262" y1="195" x2="262" y2="285"/><line x1="310" y1="195" x2="310" y2="285"/><line x1="362" y1="195" x2="362" y2="285"/><line x1="410" y1="195" x2="410" y2="285"/>
    </g>
    <rect x="239" y="197" width="194" height="84" fill="#ffbb20" opacity=".35"/>
    <circle cx="336" cy="240" r="34" fill="url(#lamp)" filter="url(#glow)"/>

    <path d="M215 193 L336 104 L457 193 Z" fill="url(#roof)" stroke="#d8e0e7" stroke-width="5"/>
    <circle cx="336" cy="89" r="22" fill="url(#roof)"/>
    <rect x="331" y="42" width="10" height="45" rx="5" fill="#0a3c6b"/>

    <g fill="none" stroke="#0a2745" stroke-width="8" stroke-linecap="round">
      <path d="M194 270 Q336 315 478 270"/>
      <path d="M194 247 Q336 290 478 247"/>
    </g>
    <g fill="#123f68">
      <circle cx="203" cy="244" r="9"/><circle cx="245" cy="251" r="9"/><circle cx="427" cy="251" r="9"/><circle cx="469" cy="244" r="9"/>
    </g>

    <circle cx="336" cy="348" r="15" fill="url(#metal)" stroke="#092847" stroke-width="6"/>

    <path d="M282 610 V534 Q282 473 336 473 Q390 473 390 534 V610 Z" fill="#f1ead9" stroke="#08294a" stroke-width="7"/>
    <path d="M336 502 C310 540 296 562 296 582 A40 40 0 0 0 376 582 C376 562 362 540 336 502 Z" fill="url(#drop)"/>
    <path d="M260 610 Q336 628 412 610" fill="none" stroke="#4e7eaa" stroke-width="6" opacity=".55"/>
    <path d="M253 314 Q336 294 419 314" fill="none" stroke="#5f91ba" stroke-width="5" opacity=".4"/>
  </g>
</svg>